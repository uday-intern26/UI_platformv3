[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aijewel-shared"
version = "0.1.0"
description = "Shared Python utilities for AIJewel microservices"
requires-python = ">=3.12"
dependencies = [
  "python-jose[cryptography]>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aijewel_shared*"]
