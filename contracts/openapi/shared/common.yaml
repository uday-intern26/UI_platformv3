openapi: 3.1.0
info:
  title: AIJewel Shared Schemas
  version: 0.1.0
  description: Common schemas reused across AIJewel microservice contracts.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Distributed tracing correlation identifier.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Idempotency key for safely retryable writes.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            details: {}
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    JobStatus:
      type: object
      required: [jobId, status, createdAt]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        statusUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal-safe monetary amount as string.
        currency:
          type: string
          minLength: 3
          maxLength: 3
    AssetMetadata:
      type: object
      properties:
        assetId:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        version:
          type: string
        checksum:
          type: string
    AuditMetadata:
      type: object
      properties:
        actorId:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        occurredAt:
          type: string
          format: date-time
    TenantContext:
      type: object
      properties:
        tenantId:
          type: string
        organizationId:
          type: string
        branchId:
          type: string
        userId:
          type: string
    Timestamp:
      type: string
      format: date-time
    PermissionRequirement:
      type: object
      properties:
        permission:
          type: string
        description:
          type: string
paths: {}
